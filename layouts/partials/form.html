<form class="mt-3" accept-charset="UTF-8" action='{{ .Site.Params.form_endpoint_volunteer }}'method="POST">

    <input type="hidden" name="utm_source" value="">
    <input type="hidden" name="utm_medium" value="">
    <input type="hidden" name="utm_campaign" value="">

    <div class="col col-12 col-sm-4 labelToggle">
        <label for="first_name">First Name*</label>
        <input type="text" id="first_name" class="formField" name="first_name" placeholder="ex. John or Jane" required>
    </div>

    <div class="col col-12 col-sm-4 labelToggle">
        <label for="last_name">Last Name*</label>
        <input type="text" id="last_name" class="formField" name="last_name" placeholder="ex. Doe" required>
    </div>


    <div class="col col-12 col-sm-4 labelToggle">
        <label for="phone">Phone Number*</label>
        <input type="tel" id="phone" class="phone" name="phone" placeholder="(123) 456-7890" required class="formField labelToggle">
    </div>


    <div class="col col-12 col-sm-9 labelToggle">
        <label for="email">Email Address*</label>
        <input type="email" id="email" name="email" placeholder="ex. yourname@email.com" required class="formField labelToggle">
    </div>
    

    <div class="col col-12 col-sm-3 labelToggle">
        <label for="zip">Zip Code*</label>
        <input type="text" id="zip" name="zipcode" placeholder="12345" required class="formField labelToggle">
    </div>

    <div class="col col-12 mt-3">
        <h3>How can you help?</h3>
    </div>

    <div class="col col-6 col-sm-4 checkbox">
        <input id="host_an_event" type="checkbox" value="true" name="host_an_event" />
        <label for="host_an_event">Host An Event</label>
    </div>

    <div class="col col-6 col-sm-4 checkbox">
        <input id="engage_online" type="checkbox" value="true" name="engage_online" />
        <label for="engage_online">Engage Online</label>
    </div>

    <div class="col col-6 col-sm-4 checkbox">
        <input id="Blockwalking" type="checkbox" value="true" name="Blockwalking" />
        <label for="Blockwalking">Blockwalking</label>
    </div>

    <div class="col col-6 col-sm-4 checkbox">
        <input id="Work Polls" type="checkbox" value="true" name="Work Polls" />
        <label for="Work Polls">Work Polls</label>
    </div>

    <div class="col col-6 col-sm-4 checkbox">
        <input id="Display Yard Sign" type="checkbox" value="true" name="Display Yard Sign" />
        <label for="Display Yard Sign">Display Yard Sign</label>
    </div>

    <div class="col col-6 col-sm-4 checkbox">
        <input id="Endorse Kelly" type="checkbox" value="true" name="Endorse Kelly" />
        <label for="Endorse Kelly">Endorse Kelly</label>
    </div>

    <div id="address-field" class="col col-12 labelToggle" style="display: none;">
        <label for="address">Home Address (For Yard Sign Shipping)*</label>
        <input type="text" id="address" class="formField" name="address">
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var yardSignCheckbox = document.getElementById("Display Yard Sign");
        var addressField = document.getElementById("address-field");

        function toggleAddressField() {
          if (yardSignCheckbox.checked) {
            addressField.style.display = "block";
            addressField.querySelector('input').required = true;
          } else {
            addressField.style.display = "none";
            addressField.querySelector('input').required = false;
          }
        }

        if (yardSignCheckbox) {
          yardSignCheckbox.addEventListener("change", toggleAddressField);
          // Initial state
          toggleAddressField();
        }
      });
    </script>


    <div class="col">
        <button type="submit" class="button">Sign Me Up!</button>
    </div>

</form>
