<div class="container animated fadeInUp">
  <div class="cs-content text-center">
    {{ with .Params.title }}
    <span class="cs-topper">{{ . }}</span>
    {{ end }} {{ with .Params.heading }}
    <h2 class="cs-title">{{ . }}</h2>
    {{ end }}
  </div>

  {{ with .Params.youtube_id }}
  <div class="cs-video-wrapper">
    <iframe
      src="https://www.youtube.com/embed/{{ . }}?rel=0&modestbranding=1"
      title="YouTube video"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
      "
      allowfullscreen
    >
    </iframe>
  </div>
  {{ end }}
</div>
